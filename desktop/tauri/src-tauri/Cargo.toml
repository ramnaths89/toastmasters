[package]
name = "toastmasters-tools"
version = "0.1.0"
description = "Native window around the existing Toastmasters HTML tools"
authors = ["Ramanathan S"]
edition = "2021"

[lib]
name = "toastmasters_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
