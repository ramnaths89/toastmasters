<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Ah&#8209;Counter&rsquo;s Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   THE AH-COUNTER'S LOG — V7
   Brutalist restyle on Toastmasters brand colours.
   Loyal Blue #004165 · True Maroon #772432 · Happy Yellow #F2DF74
   Cool Gray #A9B2B1 · black rules, flat fills, hard shadows.
   ================================================================ */
:root{
  --blue:#004165;
  --blue-dk:#00293F;
  --blue-lt:#0A5D8C;
  --maroon:#772432;
  --maroon-lt:#9E3040;
  --yellow:#F2DF74;
  --yellow-dk:#E8CB33;
  --gray:#A9B2B1;
  --gray-lt:#DCDEDA;
  --paper:#EFEEE8;
  --white:#FFFFFF;
  --ink:#0B0B0B;
  --ink-soft:#4A5150;
  --bd:3px;
  --r-h:34px;
  --pad:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Archivo',system-ui,sans-serif;font-weight:500;
  background:var(--paper);color:var(--ink);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* visible focus everywhere — brutalist and accessible */
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.shell{height:100dvh;display:flex;flex-direction:column;position:relative}

/* ---------------- header ---------------- */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:var(--blue);
  border-bottom:var(--bd) solid var(--ink);
}
.crest{
  flex:0 0 auto;width:38px;height:38px;border:var(--bd) solid var(--ink);
  display:grid;place-items:center;background:var(--yellow);
}
.crest span{font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;color:var(--ink);line-height:1}
.titles{min-width:0;display:flex;flex-direction:column;gap:3px}
.titles h1{
  font-family:'Archivo',sans-serif;font-weight:900;font-size:21px;line-height:1;
  letter-spacing:-.01em;text-transform:uppercase;color:var(--white);white-space:nowrap;
}
.titles h1 em{
  font-style:normal;background:var(--yellow);color:var(--ink);
  padding:2px 6px 3px;margin-left:3px;border:2px solid var(--ink);
}
.titles .kicker{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--white);white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:0;
}
.kicker .sep{color:var(--yellow)}
.kdate{color:#CFE0EA}
.clubField{
  font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink);background:var(--white);
  border:2px solid var(--ink);padding:3px 7px;width:21ch;min-width:0;outline:none;
  transition:width .16s,background .16s;
}
.clubField::placeholder{color:var(--ink-soft);opacity:1}
.clubField:hover{background:var(--gray-lt)}
.clubField:focus{background:var(--yellow);width:26ch}
.grow{flex:1}
.tally{
  display:flex;align-items:center;gap:10px;padding:5px 13px;
  border:var(--bd) solid var(--ink);background:var(--yellow);
}
.tally b{font-family:'Space Mono',monospace;font-weight:700;font-size:26px;color:var(--ink);line-height:1}
.tally i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);line-height:1.25;display:block}

.btn{
  font-family:'Archivo',sans-serif;font-size:11.5px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;
  padding:9px 13px;cursor:pointer;white-space:nowrap;
  background:var(--white);color:var(--ink);border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  transition:background .12s,color .12s;
}
.btn:hover{background:var(--gray-lt)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink-soft)}
.btn.gold{background:var(--yellow)}
.btn.gold:hover{background:var(--yellow-dk)}
.btn.danger:hover{background:var(--maroon);color:var(--white)}

.banner{
  flex:0 0 auto;display:none;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:var(--yellow);border-bottom:var(--bd) solid var(--ink);
  font-size:14px;font-weight:600;color:var(--ink);
}
.banner.on{display:flex}
.banner .x{margin-left:auto;display:flex;gap:8px}

/* ---------------- stage ---------------- */
.stage{flex:1;display:flex;min-height:0}

.roster{
  flex:0 0 262px;display:flex;flex-direction:column;min-height:0;
  border-right:var(--bd) solid var(--ink);background:var(--gray-lt);
}
.roster h2{
  flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--white);background:var(--blue);padding:8px 12px;
  border-bottom:2px solid var(--ink);
}
.rlist{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.rlist::-webkit-scrollbar{width:10px}
.rlist::-webkit-scrollbar-track{background:var(--gray-lt)}
.rlist::-webkit-scrollbar-thumb{background:var(--blue);border:2px solid var(--gray-lt)}

.rost{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 6px 8px 4px;cursor:pointer;position:relative;
  background:var(--white);border:2px solid var(--ink);
  color:var(--ink);font-family:'Archivo',sans-serif;
}
.rost:hover{background:var(--gray-lt)}
.rost.on{background:var(--yellow);box-shadow:4px 4px 0 var(--ink)}
.rost .rn{flex:1;min-width:0}
.rost .rnm{
  display:block;width:100%;font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;
  line-height:1.2;color:var(--ink);background:transparent;border:none;outline:none;
  border-bottom:2px solid transparent;padding:0;text-overflow:ellipsis;
}
.rost .rnm:focus{border-bottom-color:var(--ink);background:var(--white)}
.rost.blank .rnm{color:var(--ink-soft);font-style:italic;font-weight:600}
.grip{
  flex:0 0 auto;width:16px;align-self:stretch;cursor:grab;touch-action:none;
  display:grid;place-items:center;color:var(--ink-soft);font-size:13px;line-height:1;
  user-select:none;
}
.grip:hover{color:var(--ink);background:var(--gray)}
.grip:active{cursor:grabbing}
.rost.dragging{opacity:.9;background:var(--blue);color:var(--white);box-shadow:6px 6px 0 var(--ink)}
.rost.dragging .rnm,.rost.dragging .rsg,.rost.dragging .rtt{color:var(--white)}
.rlist.reordering .rost{transition:none}
.rlist.reordering .rnm{pointer-events:none}
.rost .rsg{
  display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rost.on .rsg{color:var(--ink)}
.rost .rtt{
  font-family:'Space Mono',monospace;font-weight:700;font-size:18px;color:var(--ink);
  flex:0 0 auto;min-width:22px;text-align:center;
}
.rost .rtt.z{color:var(--gray)}
.rost .rx{
  flex:0 0 auto;width:24px;height:24px;border:2px solid transparent;background:transparent;
  color:var(--ink-soft);cursor:pointer;font-size:12px;font-weight:700;line-height:1;
  display:grid;place-items:center;opacity:0;
}
.rost:hover .rx,.rost.on .rx{opacity:1}
.rost .rx:hover{color:var(--white);background:var(--maroon);border-color:var(--ink)}

.addbtn{
  margin:0 10px 10px;padding:11px;border:var(--bd) dashed var(--ink);
  background:transparent;color:var(--ink);cursor:pointer;font-family:'Archivo',sans-serif;
  font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
}
.addbtn:hover{background:var(--blue);color:var(--white);border-style:solid}

/* ---------------- desk ---------------- */
.desk{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--white)}
.deskhead{flex:0 0 auto;padding:12px var(--pad);border-bottom:var(--bd) solid var(--ink);background:var(--paper)}
.dh1{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.who{flex:1 1 220px;min-width:150px;display:flex;flex-direction:column;gap:4px}
.roleField{
  font-family:'Archivo',sans-serif;font-weight:800;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--white);background:var(--blue);
  padding:3px 8px;align-self:flex-start;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nameField{
  font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:-.01em;
  font-size:clamp(24px,2.8vw,34px);line-height:1.1;color:var(--ink);
  background:transparent;border:none;outline:none;border-bottom:var(--bd) solid var(--ink);
  padding:0 2px 2px;width:100%;
}
.nameField:focus{background:var(--yellow)}
.nameField.unset{color:var(--ink-soft);font-style:italic;font-weight:700}
.nameField:focus.unset{color:var(--ink);font-style:normal}
.nameField::placeholder{color:var(--ink-soft);font-style:italic}
.dtot{
  display:flex;align-items:center;gap:8px;flex:0 0 auto;
  border:var(--bd) solid var(--ink);background:var(--white);padding:4px 12px;
}
.dtot b{font-family:'Space Mono',monospace;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
.dtot i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

.segs{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.seg{
  font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:6px 11px;cursor:pointer;
  border:2px solid var(--ink);color:var(--ink);background:var(--white);
}
.seg:hover{background:var(--gray-lt)}
.seg.on{background:var(--blue);color:var(--white);box-shadow:3px 3px 0 var(--ink)}

.noteWrap{display:flex;align-items:center;gap:10px;margin-top:11px}
.noteWrap label{
  font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--white);background:var(--ink);padding:4px 7px;white-space:nowrap;flex:0 0 auto;
}
.note{
  flex:1;min-width:0;background:var(--white);border:2px solid var(--ink);
  color:var(--ink);font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;
  padding:8px 10px;outline:none;
}
.note:focus{background:var(--yellow)}
.note::placeholder{color:var(--ink-soft);font-style:italic}

/* ---------------- ledger ---------------- */
.ledger{flex:1;min-height:0;overflow-y:auto;padding:12px var(--pad) 20px;background:var(--white)}
.ledger::-webkit-scrollbar{width:10px}
.ledger::-webkit-scrollbar-track{background:var(--gray-lt)}
.ledger::-webkit-scrollbar-thumb{background:var(--blue);border:2px solid var(--white)}
.inner{max-width:620px}

.glabel{
  display:block;margin:18px 0 0;padding:5px 9px;
  font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--white);background:var(--ink);
}
.glabel:first-child{margin-top:0}

.row{
  display:flex;align-items:center;gap:10px;min-height:var(--r-h);
  padding:0 4px 0 10px;cursor:pointer;
  border:2px solid var(--ink);border-top:none;background:var(--white);
  position:relative;
}
.glabel + .row{border-top:none}
.row:hover{background:var(--gray-lt)}
.row:active{background:var(--gray)}
.row.lit{background:var(--yellow)}
.row.lit:hover{background:var(--yellow-dk)}
.row.flash{animation:fl .35s steps(3,end)}
@keyframes fl{0%{background:var(--blue)}100%{background:var(--yellow)}}

.rlbl{
  font-family:'Archivo',sans-serif;font-size:16px;font-weight:600;
  color:var(--ink);flex:0 0 auto;white-space:nowrap;
}
.row.lit .rlbl{font-weight:800}
.rkey{
  font-family:'Space Mono',monospace;font-weight:700;font-size:11px;color:var(--white);
  background:var(--ink);flex:0 0 auto;display:none;padding:1px 5px;
}
body.keys .rkey{display:inline-block}
.dots{flex:1;height:0;min-width:10px;border-bottom:2px dotted var(--gray);margin:0 2px}
.row.lit .dots{border-bottom-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:0;flex:0 0 auto}
.sbtn{
  width:30px;height:30px;border:2px solid var(--ink);background:var(--white);
  color:var(--ink);cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;
  font-size:16px;line-height:1;display:grid;place-items:center;
}
.sbtn:hover{background:var(--blue);color:var(--white)}
.sbtn.minus:hover{background:var(--maroon);color:var(--white)}
.rnum{
  font-family:'Space Mono',monospace;font-weight:700;font-size:18px;width:38px;
  text-align:center;color:var(--ink);flex:0 0 auto;
}
.row:not(.lit) .rnum{color:#7C8583}
.rdel{
  flex:0 0 auto;width:24px;height:24px;border:2px solid transparent;background:transparent;
  color:var(--ink-soft);cursor:pointer;font-size:12px;font-weight:700;
  display:grid;place-items:center;opacity:0;
}
.row:hover .rdel{opacity:1}
.rdel:hover{color:var(--white);background:var(--maroon);border-color:var(--ink)}

/* free-text pattern row ("other") — no stepper, just an open field */
.row.otherRow{cursor:text}
.otherIn{
  flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);
  font-family:'Archivo',sans-serif;font-weight:500;font-size:14px;padding:4px 2px;
  border-bottom:2px dotted var(--gray);
}
.otherIn:focus{border-bottom-color:var(--ink);background:var(--paper)}
.otherIn::placeholder{color:var(--ink-soft);font-style:italic;font-weight:400}
.row.otherRow.filled{background:var(--yellow)}
.row.otherRow.filled .rlbl{font-weight:800}

/* add-a-word */
.addword{
  display:flex;align-items:center;gap:10px;min-height:calc(var(--r-h) + 8px);margin-top:16px;
  padding:0 5px 0 10px;border:var(--bd) dashed var(--ink);cursor:text;background:var(--paper);
}
.addword:hover{border-style:solid}
.addword .p{color:var(--ink);font-family:'Space Mono',monospace;font-weight:700;font-size:18px;flex:0 0 auto}
.wordIn{
  flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);
  font-family:'Archivo',sans-serif;font-weight:600;font-size:15px;padding:0;
}
.wordIn::placeholder{color:var(--ink-soft);font-style:italic;font-weight:500;font-size:14px}
.addword .go{
  flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  border:2px solid var(--ink);background:var(--white);color:var(--ink);
  padding:7px 11px;cursor:pointer;font-family:'Archivo',sans-serif;
}
.addword .go:hover{background:var(--blue);color:var(--white)}

.legend{
  flex:0 0 auto;padding:9px var(--pad);border-top:var(--bd) solid var(--ink);
  background:var(--paper);
  font-size:12px;font-weight:600;color:var(--ink-soft);display:flex;gap:16px;align-items:center;flex-wrap:wrap;
}
.legend kbd{
  font-family:'Space Mono',monospace;font-weight:700;background:var(--ink);color:var(--white);
  padding:1px 5px;font-size:11px;
}
.keytoggle{
  border:2px solid var(--ink);background:var(--white);color:var(--ink);
  padding:4px 9px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;font-family:'Archivo',sans-serif;
}
.keytoggle:hover{background:var(--gray-lt)}
body.keys .keytoggle{background:var(--yellow)}
.tiLink{
  color:var(--ink-soft);font-weight:600;text-decoration:underline;text-underline-offset:2px;
  white-space:nowrap;
}
.tiLink:hover{color:var(--blue)}

/* ---------------- modal ---------------- */
.veil{position:fixed;inset:0;background:rgba(11,11,11,.72);display:none;place-items:center;z-index:200;padding:16px}
.veil.on{display:grid}
.sheet{
  width:min(880px,100%);max-height:88dvh;overflow:auto;
  background:var(--white);border:var(--bd) solid var(--ink);
  padding:22px 24px 20px;position:relative;
  box-shadow:10px 10px 0 var(--yellow),10px 10px 0 3px var(--ink);
}
.sheet h2{
  font-family:'Archivo',sans-serif;font-weight:900;font-size:30px;line-height:1.05;
  text-transform:uppercase;letter-spacing:-.01em;
}
.sheet h2 em{font-style:normal;background:var(--yellow);border:2px solid var(--ink);padding:1px 7px 3px}
.sheet .sub{
  font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);background:var(--gray-lt);border-left:6px solid var(--blue);
  padding:6px 9px;margin:12px 0 16px;
}
table{width:100%;border-collapse:collapse;font-size:13px;border:2px solid var(--ink)}
th{
  text-align:left;font-family:'Archivo',sans-serif;font-weight:800;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--white);background:var(--blue);
  padding:8px 6px;border:1px solid var(--ink);
}
th.n,td.n{text-align:center}
td{padding:8px 6px;border:1px solid var(--gray);font-family:'Space Mono',monospace;font-size:13px;font-weight:700}
td.nm{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px}
td.sg{font-family:'Archivo',sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
td.tt{background:var(--yellow)}
tr.zero td{color:var(--ink-soft);background:#F7F7F5}
tr.zero td.tt{background:var(--gray-lt)}
.script{
  margin-top:18px;padding:15px 17px;border:2px solid var(--ink);border-left:10px solid var(--blue);
  background:var(--paper);font-size:15px;line-height:1.65;color:var(--ink);font-weight:500;
}
.script b{font-weight:800}
.script .ph{color:var(--ink-soft);font-style:italic;display:block;margin-top:4px;font-size:14px}
.script .rl{
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--white);background:var(--blue);padding:2px 6px;margin-left:6px;
}
.script .hd{
  font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--white);background:var(--ink);padding:4px 8px;margin-bottom:12px;display:inline-block;
}
.sfoot{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}

/* ---- add-speaker picker ---- */
.pickgrp{margin-top:16px}
.pickgrp .gl{
  display:inline-block;margin-bottom:8px;padding:4px 8px;
  font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--white);background:var(--ink);
}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{
  font-family:'Archivo',sans-serif;font-size:13.5px;font-weight:700;
  padding:8px 13px;cursor:pointer;
  border:2px solid var(--ink);color:var(--ink);background:var(--white);
  box-shadow:3px 3px 0 var(--ink);white-space:nowrap;
}
.pick:hover{background:var(--yellow)}
.pick:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pick b{font-family:'Space Mono',monospace;font-weight:700;margin-left:5px}
.manual{
  display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:var(--bd) solid var(--ink);
  align-items:center;flex-wrap:wrap;
}
.manual input{
  flex:1;min-width:180px;background:var(--white);border:2px solid var(--ink);
  color:var(--ink);font-family:'Archivo',sans-serif;font-weight:600;font-size:14px;
  padding:9px 11px;outline:none;
}
.manual input:focus{background:var(--yellow)}
.manual input::placeholder{color:var(--ink-soft);font-style:italic;font-weight:500}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);
  background:var(--yellow);color:var(--ink);font-weight:800;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;padding:12px 20px;z-index:300;
  border:var(--bd) solid var(--ink);box-shadow:5px 5px 0 var(--ink);
  transition:transform .22s steps(4,end);
}
.toast.on{transform:translate(-50%,0)}

/* ---------------- tablet ---------------- */
@media (max-width:1000px){ .roster{flex:0 0 224px} }

/* ---------------- mobile ---------------- */
@media (max-width:760px){
  :root{--r-h:46px;--pad:12px;--bd:3px}
  header{padding:9px 12px;gap:10px;flex-wrap:wrap}
  .crest{width:34px;height:34px}
  .crest span{font-size:19px}
  .titles h1{font-size:17px}
  .titles .kicker{gap:0;font-size:10px}
  .kicker .sep,.kicker .kdate{display:none}
  .clubField{width:100%;font-size:10px}
  .clubField:focus{width:100%}
  .tally{padding:4px 10px;gap:8px}
  .tally b{font-size:20px}
  .tally i{font-size:8.5px}
  .btn{padding:8px 10px;font-size:10.5px;letter-spacing:.05em;box-shadow:2px 2px 0 var(--ink)}

  .stage{flex-direction:column}
  .roster{flex:0 0 auto;flex-direction:row;align-items:stretch;border-right:none;border-bottom:var(--bd) solid var(--ink)}
  .roster h2{display:none}
  .rlist{flex:1;min-width:0;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:10px 0 10px 10px;gap:8px;scroll-snap-type:x proximity}
  .rlist::-webkit-scrollbar{height:0}
  .rost{flex:0 0 auto;width:auto;min-width:158px;max-width:215px;scroll-snap-align:start}
  .rost.on{box-shadow:3px 3px 0 var(--ink)}
  .rost .rx{opacity:1}
  .addbtn{flex:0 0 auto;margin:10px;padding:0 15px;align-self:stretch;font-size:18px;letter-spacing:0}
  .addbtn .word{display:none}

  .deskhead{padding:10px var(--pad)}
  .nameField{font-size:26px;flex:1 1 100%}
  .dtot b{font-size:26px}
  .inner{max-width:none}
  .rlbl{font-size:17px}
  .rnum{font-size:20px;width:42px}
  .sbtn{width:40px;height:40px;font-size:19px}
  .rdel{opacity:1}
  .legend{font-size:11px;gap:12px}
  .legend .desktoponly{display:none}
  .sheet{padding:18px 16px 16px;box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink)}
  .sheet h2{font-size:23px}
  table{font-size:12px}
}
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="crest"><span>A</span></div>
    <div class="titles">
      <h1>The Ah&#8209;Counter&rsquo;s <em>Log</em></h1>
      <span class="kicker" id="kicker">
        <input class="clubField" id="clubField" placeholder="Your club" aria-label="Club name" maxlength="70" autocomplete="organization">
        <span class="sep">&middot;</span><span class="kdate" id="kdate"></span>
      </span>
    </div>
    <div class="grow"></div>
    <div class="tally"><b id="grandNum">0</b><i>Total<br>crutches</i></div>
    <button class="btn" id="undoBtn" disabled>&#8630;&nbsp; Undo</button>
    <button class="btn danger" id="resetBtn">Reset</button>
    <button class="btn gold" id="reportBtn">Report</button>
  </header>

  <div class="banner" id="banner">
    <span id="bannerTxt"></span>
    <span class="x">
      <button class="btn gold" id="keepBtn">Keep it</button>
      <button class="btn" id="freshBtn">Start fresh</button>
    </span>
  </div>

  <div class="stage">
    <aside class="roster">
      <h2>Speakers</h2>
      <div class="rlist" id="rlist"></div>
      <button class="addbtn" id="addBtn">+<span class="word">&nbsp; Add speaker</span></button>
    </aside>

    <section class="desk">
      <div class="deskhead">
        <div class="dh1">
          <div class="who">
            <div class="roleField" id="roleField"></div>
            <input class="nameField" id="nameField" placeholder="name" aria-label="Person's name">
          </div>
          <div class="dtot"><b id="deskTot">0</b><i>crutches</i></div>
        </div>
        <div class="segs" id="segs"></div>
        <div class="noteWrap">
          <label for="noteField">Remarks</label>
          <input class="note" id="noteField" placeholder="When do the crutches show up? Favourite word? Anything to feed back &mdash; e.g. &ldquo;ums cluster when he leaves his notes&rdquo;, &ldquo;says &lsquo;basically&rsquo; before every point&rdquo;" aria-label="Remarks">
        </div>
      </div>

      <div class="ledger"><div class="inner" id="inner"></div></div>

      <div class="legend">
        <span>Tap a line to add &middot; drag &#9782; to reorder speakers</span>
        <span class="desktoponly"><kbd>Z</kbd> undo &middot; <kbd>&#8593;</kbd><kbd>&#8595;</kbd> change speaker</span>
        <button class="keytoggle desktoponly" id="keyToggle">Show letter keys</button>
        <a class="tiLink" href="https://www.toastmasters.org/resources/ah-counter-script-and-log" target="_blank" rel="noopener noreferrer">TI&rsquo;s official Ah&#8209;Counter script &amp; log &#8599;</a>
        <span id="saveState"></span>
      </div>
    </section>
  </div>

</div>

<div class="veil" id="veil">
  <div class="sheet">
    <h2>Ah&#8209;Counter&rsquo;s <em>Report</em></h2>
    <p class="sub" id="reportSub"></p>
    <div id="reportTable"></div>
    <div class="script" id="reportScript"></div>
    <div class="sfoot">
      <button class="btn gold" id="copyBtn">Copy report</button>
      <button class="btn" id="csvBtn">Download CSV</button>
      <button class="btn" id="closeBtn">Close</button>
    </div>
  </div>
</div>

<div class="veil" id="addVeil">
  <div class="sheet" style="max-width:660px">
    <h2>Add an <em>appointment</em></h2>
    <p class="sub">Pick one, or type your own below</p>
    <div id="pickBody"></div>
    <div class="manual">
      <input id="manualRole" placeholder="Something else — e.g. &ldquo;Guest from Orchid TMC&rdquo;" aria-label="Custom appointment">
      <button class="btn gold" id="manualGo">Add</button>
      <button class="btn" id="addCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- fixed word list ---------------- */
  var BASE = [
    { name:'filler sounds', items:[
      {id:'ah',label:'ah / uh',key:'a'},{id:'um',label:'um / mm / hmm',key:'u'},
      {id:'er',label:'er',key:'e'}
    ]},
    { name:'connectors', items:[
      {id:'and',label:'and',key:'n'},{id:'so',label:'so',key:'s'},
      {id:'but',label:'but',key:'b'},{id:'well',label:'well',key:'w'},
      {id:'okay',label:'okay',key:'o'}
    ]},
    { name:'qualifiers', items:[
      {id:'like',label:'like',key:'l'},{id:'yknow',label:'you know',key:'k'},
      {id:'right',label:'right',key:'g'},{id:'actly',label:'actually',key:'c'},
      {id:'basic',label:'basically',key:'y'},{id:'imean',label:'i mean',key:'m'},
      {id:'just',label:'just',key:'j'}
    ]},
    { name:'patterns', items:[
      {id:'repeat',label:'repeated (word/phrase)',key:'r'}
    ]}
  ];

  /* "other" (patterns group) is a free-text note, not a counted word — it does not
     appear in BASE/allWords()/counts. It gets its own per-speaker string field
     (sp.otherText) rendered as an open row at the end of the patterns group. */
  var OTHER_LABEL = 'other';

  var SEGMENTS = ['Prepared Speech','Table Topics','Evaluation','Educational','Meeting Role','Other'];

  /* default roster, in meeting order */
  var SEED = [
    ['Toastmaster of the Day','Meeting Role'],
    ['Sergeant-at-Arms (SAA)','Meeting Role'],
    ['Club President','Meeting Role'],
    ['Timer','Meeting Role'],
    ['Language Evaluator','Meeting Role'],
    ['Speaker 1','Prepared Speech'],
    ['Speaker 2','Prepared Speech'],
    ['Speaker 3','Prepared Speech'],
    ['Table Topics Master','Meeting Role'],
    ['TT Speaker 1','Table Topics'],
    ['TT Speaker 2','Table Topics'],
    ['TT Speaker 3','Table Topics'],
    ['Speech Evaluator 1','Evaluation'],
    ['Speech Evaluator 2','Evaluation'],
    ['Speech Evaluator 3','Evaluation']
  ];

  /* picker: n:true = auto-numbered (Speaker 1, Speaker 2 …) */
  var PICKS = [
    { name:'Speeches', items:[
      { label:'Speaker',            seg:'Prepared Speech', n:true },
      { label:'Guest Speaker',      seg:'Prepared Speech' },
      { label:'Educational Speaker',seg:'Educational' }
    ]},
    { name:'Evaluations', items:[
      { label:'Speech Evaluator',   seg:'Evaluation', n:true },
      { label:'General Evaluator',  seg:'Evaluation' }
    ]},
    { name:'Table topics', items:[
      { label:'Table Topics Master',seg:'Meeting Role' },
      { label:'TT Speaker',         seg:'Table Topics', n:true }
    ]},
    { name:'Meeting roles', items:[
      { label:'Toastmaster of the Day', seg:'Meeting Role' },
      { label:'Sergeant-at-Arms (SAA)', seg:'Meeting Role' },
      { label:'Club President',         seg:'Meeting Role' },
      { label:'Timer',                  seg:'Meeting Role' },
      { label:'Ah-Counter',             seg:'Meeting Role' },
      { label:'Grammarian',             seg:'Meeting Role' },
      { label:'Language Evaluator',     seg:'Meeting Role' }
    ]},
    { name:'Everyone else', items:[
      { label:'Guest',  seg:'Other' },
      { label:'Member', seg:'Other' }
    ]}
  ];

  var STORE_KEY = 'ahcounter.log.v4';

  /* ---------------- state ---------------- */
  var uid = 0, cid = 0;
  var custom = [];              /* [{id,label}] added by the user */

  function allWords(){
    var out = [];
    BASE.forEach(function(g){ g.items.forEach(function(f){ out.push(f); }); });
    custom.forEach(function(f){ out.push(f); });
    return out;
  }
  function groups(){
    var g = BASE.slice();
    if (custom.length) g = g.concat([{ name:'your words', items:custom, own:true }]);
    return g;
  }
  function labelOf(id){
    var all = allWords();
    for (var i=0;i<all.length;i++) if (all[i].id===id) return all[i].label;
    return id;
  }

  function blank(){ var c={}; allWords().forEach(function(f){ c[f.id]=0; }); return c; }
  var PLACEHOLDER = 'name';
  function newSpeaker(role,seg){
    uid++;
    return { id:'s'+uid, role:role||'', name:PLACEHOLDER, segment:seg||'Prepared Speech', note:'', otherText:'', counts:blank() };
  }
  function unnamed(sp){
    var n = (sp.name||'').trim().toLowerCase();
    return !n || n === PLACEHOLDER;
  }
  function fresh(){
    uid = 0; cid = 0; custom = [];
    var a = SEED.map(function(s){ return newSpeaker(s[0], s[1]); });
    return { speakers:a, active:a[0].id, history:[] };
  }
  var state = fresh();

  /* ---------------- storage ---------------- */
  var storeOK = true;
  function save(){
    if (!storeOK) return;
    try{
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        v:3, uid:uid, cid:cid, custom:custom, at:new Date().toISOString(),
        speakers:state.speakers, active:state.active
      }));
    }catch(e){ storeOK = false; markSaveState(); }
  }
  function load(){
    try{
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      return (d && d.speakers && d.speakers.length) ? d : null;
    }catch(e){ storeOK = false; return null; }
  }
  function wipe(){ try{ window.localStorage.removeItem(STORE_KEY); }catch(e){} }

  /* Club name is a club constant, not meeting data: it lives under its own key
     so Reset / Start fresh (which wipe STORE_KEY) leave it alone. */
  var CLUB_KEY = 'ahcounter.club';
  function clubName(){
    var el = document.getElementById('clubField');
    return el ? (el.value||'').trim() : '';
  }
  function loadClub(){
    try{
      var v = window.localStorage.getItem(CLUB_KEY);
      if (v) document.getElementById('clubField').value = v;
    }catch(e){}
  }
  function saveClub(){
    try{ window.localStorage.setItem(CLUB_KEY, clubName()); }catch(e){}
  }

  var $ = function(id){ return document.getElementById(id); };
  function markSaveState(){
    var el = $('saveState');
    el.textContent = storeOK ? '' : 'Not saved — this preview blocks storage';
    el.style.color = storeOK ? '' : '#772432';
  }

  /* ---------------- helpers ---------------- */
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function find(id){
    for (var i=0;i<state.speakers.length;i++) if (state.speakers[i].id===id) return state.speakers[i];
    return null;
  }
  function total(sp){ var t=0; for (var k in sp.counts) t += (sp.counts[k]||0); return t; }
  function grand(){ var t=0; state.speakers.forEach(function(s){ t+=total(s); }); return t; }
  function nameOf(sp,i){
    if (!unnamed(sp)) return sp.name;
    return sp.role || ('Speaker ' + ((i!=null?i:state.speakers.indexOf(sp))+1));
  }
  /* second line of a roster row */
  function subOf(sp){ return sp.role || sp.segment; }
  /* how a person is identified in the report */
  function tagOf(sp,i){
    if (!unnamed(sp) && sp.role) return esc(sp.name) + ' <span class="rl">' + esc(sp.role) + '</span>';
    return esc(nameOf(sp,i));
  }
  function plainTag(sp,i){
    if (!unnamed(sp) && sp.role) return sp.name + ' (' + sp.role + ')';
    return nameOf(sp,i);
  }
  function active(){ return find(state.active) || state.speakers[0]; }

  var toastTimer;
  function toast(msg){
    var t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1500);
  }

  /* ---------------- roster ---------------- */
  function renderRoster(){
    var list = $('rlist');
    list.innerHTML = '';
    state.speakers.forEach(function(sp,i){
      var t = total(sp);
      var b = document.createElement('div');
      b.className = 'rost' + (sp.id===state.active?' on':'') + (unnamed(sp)?' blank':'');
      b.dataset.id = sp.id;
      b.setAttribute('role','button');
      b.innerHTML =
        '<span class="grip" title="Drag to reorder">&#9782;</span>' +
        '<span class="rn">' +
          '<input class="rnm" value="' + esc(sp.name) + '" aria-label="Person\'s name" spellcheck="false">' +
          '<span class="rsg">' + esc(subOf(sp)) + '</span>' +
        '</span>' +
        '<span class="rtt' + (t===0?' z':'') + '">' + t + '</span>' +
        '<button class="rx" title="Remove">&#10005;</button>';

      var inp = b.querySelector('.rnm');
      inp.addEventListener('focus', function(){
        focusSpeaker(sp.id);
        this.select();
      });
      inp.addEventListener('mouseup', function(ev){ ev.preventDefault(); });
      inp.addEventListener('input', function(){
        sp.name = this.value;
        b.classList.toggle('blank', unnamed(sp));
        var nf = $('nameField');
        if (state.active === sp.id && document.activeElement !== nf) nf.value = sp.name;
        save();
      });
      inp.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter'){ this.blur(); }
        ev.stopPropagation();
      });

      b.addEventListener('click', function(ev){
        if (ev.target.classList.contains('rx')){ removeSpeaker(sp.id); return; }
        if (ev.target.classList.contains('rnm')) return;
        if (ev.target.classList.contains('grip')) return;
        focusSpeaker(sp.id);
      });

      b.querySelector('.grip').addEventListener('pointerdown', function(ev){ startDrag(ev, b); });

      list.appendChild(b);
    });
  }

  /* ---------------- drag to reorder ---------------- */
  function startDrag(ev, node){
    ev.preventDefault();
    var list = $('rlist');
    var horizontal = window.matchMedia('(max-width:760px)').matches;
    node.classList.add('dragging');
    list.classList.add('reordering');
    try{ ev.target.setPointerCapture(ev.pointerId); }catch(e){}

    function move(e){
      var siblings = Array.prototype.slice.call(list.querySelectorAll('.rost'))
                       .filter(function(x){ return x !== node; });
      var pos = horizontal ? e.clientX : e.clientY;
      var before = null;
      for (var i=0;i<siblings.length;i++){
        var r = siblings[i].getBoundingClientRect();
        var mid = horizontal ? (r.left + r.width/2) : (r.top + r.height/2);
        if (pos < mid){ before = siblings[i]; break; }
      }
      if (before) { if (before.previousSibling !== node) list.insertBefore(node, before); }
      else if (list.lastElementChild !== node) list.appendChild(node);
    }

    function end(e){
      node.classList.remove('dragging');
      list.classList.remove('reordering');
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      window.removeEventListener('pointercancel', end);
      var order = Array.prototype.slice.call(list.querySelectorAll('.rost'))
                    .map(function(x){ return x.dataset.id; });
      state.speakers.sort(function(a,b){ return order.indexOf(a.id) - order.indexOf(b.id); });
      paintDesk();
      save();
    }

    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  }
  function touchRoster(spId){
    var sp = find(spId); if (!sp) return;
    var el = $('rlist').querySelector('.rost[data-id="'+spId+'"]');
    if (!el) return;
    var t = total(sp);
    var inp = el.querySelector('.rnm');
    if (document.activeElement !== inp) inp.value = sp.name;
    el.querySelector('.rsg').textContent = subOf(sp);
    var tt = el.querySelector('.rtt');
    tt.textContent = t; tt.classList.toggle('z', t===0);
    el.classList.toggle('blank', unnamed(sp));
  }
  function removeSpeaker(id){
    if (state.speakers.length <= 1) return;
    var sp = find(id);
    if (sp && total(sp) > 0 && !window.confirm('Remove ' + nameOf(sp) + ' and their ' + total(sp) + ' counts?')) return;
    state.speakers = state.speakers.filter(function(x){ return x.id !== id; });
    state.history = state.history.filter(function(h){ return h.sp !== id; });
    if (state.active === id) state.active = state.speakers[0].id;
    $('undoBtn').disabled = state.history.length === 0;
    renderRoster(); paintDesk();
    $('grandNum').textContent = grand();
    save();
  }

  /* ---------------- desk ---------------- */
  function renderSegs(){
    var wrap = $('segs');
    wrap.innerHTML = '';
    SEGMENTS.forEach(function(s){
      var b = document.createElement('button');
      b.className = 'seg' + (active().segment===s?' on':'');
      b.textContent = s;
      b.addEventListener('click', function(){
        active().segment = s;
        wrap.querySelectorAll('.seg').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        touchRoster(state.active); save();
      });
      wrap.appendChild(b);
    });
  }

  function renderLedger(){
    var inner = $('inner');
    inner.innerHTML = '';
    groups().forEach(function(g){
      var lab = document.createElement('div');
      lab.className = 'glabel';
      lab.appendChild(document.createTextNode(g.name));
      inner.appendChild(lab);

      g.items.forEach(function(f){
        var row = document.createElement('div');
        row.className = 'row';
        row.dataset.f = f.id;
        row.innerHTML =
          '<span class="rlbl">' + esc(f.label) + '</span>' +
          (f.key ? '<span class="rkey">' + f.key.toUpperCase() + '</span>' : '') +
          '<span class="dots"></span>' +
          (g.own ? '<button class="rdel" title="Remove word">&#10005;</button>' : '') +
          '<span class="stepper">' +
            '<button class="sbtn minus" aria-label="subtract">&minus;</button>' +
            '<span class="rnum">0</span>' +
            '<button class="sbtn plus" aria-label="add">+</button>' +
          '</span>';
        row.addEventListener('click', function(ev){
          if (ev.target.classList.contains('rdel')){ removeWord(f.id); return; }
          if (ev.target.classList.contains('minus')){ bump(state.active, f.id, -1); return; }
          bump(state.active, f.id, +1);
        });
        inner.appendChild(row);
      });

      if (g.name === 'patterns' && !g.own){
        var orow = document.createElement('div');
        orow.className = 'row otherRow';
        orow.innerHTML =
          '<span class="rlbl">' + esc(OTHER_LABEL) + '</span>' +
          '<input class="otherIn" id="otherIn" placeholder="what did you hear? e.g. a nervous laugh, trailing off mid-sentence…" aria-label="Other crutch or pattern" spellcheck="false">';
        orow.addEventListener('click', function(ev){
          if (ev.target.id !== 'otherIn') $('otherIn').focus();
        });
        inner.appendChild(orow);
      }
    });

    var add = document.createElement('div');
    add.className = 'addword';
    add.innerHTML =
      '<span class="p">+</span>' +
      '<input class="wordIn" id="wordIn" placeholder="add a word or sound you keep hearing" aria-label="Add a word">' +
      '<button class="go" id="wordGo">Add</button>';
    inner.appendChild(add);

    add.addEventListener('click', function(ev){
      if (ev.target.id === 'wordGo'){ addWord(); return; }
      $('wordIn').focus();
    });
    $('wordIn').addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){ ev.preventDefault(); addWord(); }
      ev.stopPropagation();
    });

    wireOtherIn();
  }

  function addWord(){
    var inp = $('wordIn');
    var txt = (inp.value||'').trim().toLowerCase().replace(/\s+/g,' ');
    if (!txt) { inp.focus(); return; }
    if (txt.length > 28) txt = txt.slice(0,28);
    var clash = allWords().some(function(f){ return f.label === txt; });
    if (clash){ toast('“' + txt + '” is already there'); inp.value=''; return; }
    cid++;
    var f = { id:'c'+cid, label:txt };
    custom.push(f);
    state.speakers.forEach(function(sp){ if (sp.counts[f.id]==null) sp.counts[f.id] = 0; });
    inp.value = '';
    renderLedger(); paintDesk(); save();
    toast('Added “' + txt + '”');
    var el = $('wordIn'); if (el) el.focus();
  }
  function wireOtherIn(){
    var oi = $('otherIn');
    if (!oi) return;
    oi.addEventListener('input', function(){
      active().otherText = this.value;
      this.closest('.row').classList.toggle('filled', !!this.value.trim());
      save();
    });
    oi.addEventListener('keydown', function(ev){ ev.stopPropagation(); });
  }

  function removeWord(fid){
    var f = null;
    custom.forEach(function(x){ if (x.id===fid) f = x; });
    if (!f) return;
    var used = state.speakers.some(function(sp){ return (sp.counts[fid]||0) > 0; });
    if (used && !window.confirm('Remove “' + f.label + '” and its counts?')) return;
    custom = custom.filter(function(x){ return x.id !== fid; });
    state.speakers.forEach(function(sp){ delete sp.counts[fid]; });
    state.history = state.history.filter(function(h){ return h.f !== fid; });
    $('undoBtn').disabled = state.history.length === 0;
    renderLedger(); paintDesk();
    $('grandNum').textContent = grand();
    save();
  }

  function paintDesk(){
    var sp = active();
    var i = state.speakers.indexOf(sp);
    $('roleField').textContent = sp.role || ('Speaker ' + (i+1));
    var nf = $('nameField');
    if (document.activeElement !== nf) nf.value = sp.name;
    nf.classList.toggle('unset', unnamed(sp));
    var nt = $('noteField');
    if (document.activeElement !== nt) nt.value = sp.note || '';
    $('deskTot').textContent = total(sp);
    allWords().forEach(function(f){
      var row = $('inner').querySelector('.row[data-f="'+f.id+'"]');
      if (!row) return;
      var v = sp.counts[f.id] || 0;
      row.querySelector('.rnum').textContent = v;
      row.classList.toggle('lit', v>0);
    });
    var oi = $('otherIn');
    if (oi){
      if (document.activeElement !== oi) oi.value = sp.otherText || '';
      oi.closest('.row').classList.toggle('filled', !!(sp.otherText||'').trim());
    }
    renderSegs();
  }

  function focusSpeaker(id){
    if (state.active === id) return;
    state.active = id;
    $('rlist').querySelectorAll('.rost').forEach(function(el){
      el.classList.toggle('on', el.dataset.id === id);
    });
    var el = $('rlist').querySelector('.rost[data-id="'+id+'"]');
    if (el && el.scrollIntoView) el.scrollIntoView({block:'nearest', inline:'nearest'});
    paintDesk(); save();
  }

  /* ---------------- mutate ---------------- */
  function bump(spId, fid, delta, silent){
    var sp = find(spId); if (!sp) return;
    var next = (sp.counts[fid]||0) + delta;
    if (next < 0) return;
    sp.counts[fid] = next;
    if (!silent) state.history.push({sp:spId, f:fid, d:delta});
    if (state.active === spId){
      var row = $('inner').querySelector('.row[data-f="'+fid+'"]');
      if (row){
        row.querySelector('.rnum').textContent = next;
        row.classList.toggle('lit', next>0);
        if (delta>0){ row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
      }
      $('deskTot').textContent = total(sp);
    }
    touchRoster(spId);
    $('grandNum').textContent = grand();
    $('undoBtn').disabled = state.history.length === 0;
    save();
  }

  function undo(){
    var last = state.history.pop();
    if (!last) return;
    if (state.active !== last.sp) focusSpeaker(last.sp);
    bump(last.sp, last.f, -last.d, true);
    $('undoBtn').disabled = state.history.length === 0;
    toast('Undid ' + labelOf(last.f));
  }

  /* next free number for a base label, e.g. Speaker -> 3 */
  function nextNum(base){
    var re = new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s+(\\d+)$', 'i');
    var max = 0;
    state.speakers.forEach(function(sp){
      var m = re.exec((sp.role||'').trim());
      if (m) max = Math.max(max, parseInt(m[1],10));
    });
    return max + 1;
  }

  function addSpeaker(role, seg){
    var sp = newSpeaker(role, seg || 'Other');
    state.speakers.push(sp);
    state.active = sp.id;
    renderRoster(); paintDesk(); save();
    var el = $('rlist').querySelector('.rost[data-id="'+sp.id+'"]');
    if (el && el.scrollIntoView) el.scrollIntoView({block:'nearest', inline:'nearest'});
    $('nameField').focus();
    toast('Added ' + role);
  }

  function openPicker(){
    var body = $('pickBody');
    body.innerHTML = '';
    PICKS.forEach(function(g){
      var box = document.createElement('div');
      box.className = 'pickgrp';
      var gl = document.createElement('div');
      gl.className = 'gl';
      gl.textContent = g.name;
      box.appendChild(gl);
      var row = document.createElement('div');
      row.className = 'picks';
      g.items.forEach(function(it){
        var num = it.n ? nextNum(it.label) : null;
        var b = document.createElement('button');
        b.className = 'pick';
        b.innerHTML = esc(it.label) + (num ? ' <b>' + num + '</b>' : '');
        b.addEventListener('click', function(){
          closePicker();
          addSpeaker(it.label + (num ? ' ' + num : ''), it.seg);
        });
        row.appendChild(b);
      });
      box.appendChild(row);
      body.appendChild(box);
    });
    $('manualRole').value = '';
    $('addVeil').classList.add('on');
  }
  function closePicker(){ $('addVeil').classList.remove('on'); }

  function step(dir){
    var i = state.speakers.indexOf(active());
    var n = (i + dir + state.speakers.length) % state.speakers.length;
    focusSpeaker(state.speakers[n].id);
  }

  /* ---------------- report ---------------- */
  function usedCols(){
    return allWords().filter(function(f){
      return state.speakers.some(function(sp){ return (sp.counts[f.id]||0) > 0; });
    });
  }
  function buildReport(){
    var cols = usedCols(), hasOther = state.speakers.some(function(sp){ return (sp.otherText||'').trim(); }), html;
    if (!cols.length && !hasOther){
      html = '<p class="sub" style="margin:0">Nothing counted yet.</p>';
    } else {
      html = '<table><thead><tr><th>Speaker</th><th>Appointment</th><th>Segment</th>';
      cols.forEach(function(f){ html += '<th class="n">' + esc(f.label) + '</th>'; });
      html += '<th class="n">Total</th>';
      if (hasOther) html += '<th>Other</th>';
      html += '</tr></thead><tbody>';
      state.speakers.forEach(function(sp,i){
        var t = total(sp);
        html += '<tr' + (t===0 && !(sp.otherText||'').trim()?' class="zero"':'') + '>';
        html += '<td class="nm">' + esc(nameOf(sp,i)) + '</td>' +
                '<td class="sg">' + esc(sp.name ? (sp.role||'') : '') + '</td>' +
                '<td class="sg">' + esc(sp.segment) + '</td>';
        cols.forEach(function(f){
          var v = sp.counts[f.id]||0;
          html += '<td class="n">' + (v>0?v:'&middot;') + '</td>';
        });
        html += '<td class="n tt">' + t + '</td>';
        if (hasOther) html += '<td>' + (sp.otherText ? esc(sp.otherText) : '&middot;') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    $('reportTable').innerHTML = html;

    var lines = [];
    state.speakers.forEach(function(sp,i){
      var t = total(sp);
      if (t === 0 && !sp.note && !(sp.otherText||'').trim()) return;
      var parts = [];
      allWords().forEach(function(f){
        var v = sp.counts[f.id]||0;
        if (v>0) parts.push(v + ' &times; <b>' + esc(f.label) + '</b>');
      });
      var line = '<b>' + tagOf(sp,i) + '</b> &mdash; ' +
                 (parts.length ? parts.join(', ') + '. Total ' + t + '.' : 'no crutches counted.');
      if (sp.otherText) line += ' <span class="ph">Other: ' + esc(sp.otherText) + '</span>';
      if (sp.note) line += ' <span class="ph">' + esc(sp.note) + '</span>';
      lines.push(line);
    });
    $('reportScript').innerHTML = '<div class="hd">Read this out</div>' +
      (lines.length ? lines.join('<br><br>') : '<span style="color:#4A5150">Nothing recorded yet.</span>');

    var club = clubName();
    $('reportSub').textContent =
      (club ? club + '  ·  ' : '') +
      new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}) +
      '  ·  ' + grand() + ' crutches  ·  ' + state.speakers.length + ' speakers';
  }

  function plainText(){
    var club = clubName();
    var out = [(club ? club.toUpperCase() + '  ::  ' : '') +
               'AH-COUNTER REPORT  ' + new Date().toLocaleDateString(), ''];
    state.speakers.forEach(function(sp,i){
      var parts = [];
      allWords().forEach(function(f){
        var v = sp.counts[f.id]||0;
        if (v>0) parts.push(f.label + ' ' + v);
      });
      var line = plainTag(sp,i) + '  [' + sp.segment + ']  total ' + total(sp);
      if (parts.length) line += '  ::  ' + parts.join(', ');
      if (sp.otherText) line += '  ::  other: ' + sp.otherText;
      if (sp.note) line += '  ::  remarks: ' + sp.note;
      out.push(line);
    });
    out.push('', 'Grand total: ' + grand());
    return out.join('\n');
  }
  function csvText(){
    var words = allWords();
    var club = clubName();
    var rows = [['Club','Speaker','Appointment','Segment'].concat(words.map(function(f){ return f.label; })).concat(['Total','Other','Remarks'])];
    state.speakers.forEach(function(sp,i){
      rows.push([club, nameOf(sp,i), (sp.name ? (sp.role||'') : ''), sp.segment]
        .concat(words.map(function(f){ return sp.counts[f.id]||0; }))
        .concat([total(sp), sp.otherText||'', sp.note||'']));
    });
    return rows.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(',');
    }).join('\n');
  }

  /* ---------------- wiring ---------------- */
  $('nameField').addEventListener('input', function(){
    active().name = this.value;
    this.classList.toggle('unset', unnamed(active()));
    touchRoster(state.active); save();
  });
  $('nameField').addEventListener('focus', function(){ this.select(); });
  $('nameField').addEventListener('mouseup', function(ev){ ev.preventDefault(); });
  $('noteField').addEventListener('input', function(){ active().note = this.value; save(); });
  $('addBtn').addEventListener('click', openPicker);
  $('addCancel').addEventListener('click', closePicker);
  $('addVeil').addEventListener('click', function(ev){ if (ev.target === this) closePicker(); });
  function manualAdd(){
    var v = ($('manualRole').value||'').trim();
    if (!v){ $('manualRole').focus(); return; }
    closePicker();
    addSpeaker(v, 'Other');
  }
  $('manualGo').addEventListener('click', manualAdd);
  $('manualRole').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); manualAdd(); }
    ev.stopPropagation();
  });
  $('undoBtn').addEventListener('click', undo);
  $('keyToggle').addEventListener('click', function(){
    var on = document.body.classList.toggle('keys');
    this.textContent = on ? 'Hide letter keys' : 'Show letter keys';
  });

  $('resetBtn').addEventListener('click', function(){
    if (grand() > 0 && !window.confirm('Clear all counts and restore the default appointment list?')) return;
    state = fresh(); wipe();
    $('undoBtn').disabled = true;
    renderLedger(); renderRoster(); paintDesk();
    $('grandNum').textContent = 0;
    $('banner').classList.remove('on');
    toast('Log cleared');
  });

  $('reportBtn').addEventListener('click', function(){ buildReport(); $('veil').classList.add('on'); });
  $('closeBtn').addEventListener('click', function(){ $('veil').classList.remove('on'); });
  $('veil').addEventListener('click', function(ev){ if (ev.target === this) this.classList.remove('on'); });

  $('copyBtn').addEventListener('click', function(){
    var txt = plainText();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('Report copied'); }, function(){ fb(txt); });
    } else fb(txt);
    function fb(t){
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast('Report copied'); }catch(e){ toast('Copy failed'); }
      document.body.removeChild(ta);
    }
  });

  $('csvBtn').addEventListener('click', function(){
    var blob = new Blob([csvText()], {type:'text/csv;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var stamp = String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    var slug = clubName().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    var a = document.createElement('a');
    a.href = url; a.download = 'AhCounterV7_' + (slug ? slug + '_' : '') + stamp + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 800);
    toast('CSV downloaded');
  });

  document.addEventListener('keydown', function(ev){
    var tag = (ev.target.tagName||'').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if ($('addVeil').classList.contains('on')){ if (ev.key==='Escape') closePicker(); return; }
    if ($('veil').classList.contains('on')){ if (ev.key==='Escape') $('veil').classList.remove('on'); return; }
    var k = (ev.key||'').toLowerCase();
    if (k === 'z'){ ev.preventDefault(); undo(); return; }
    if (k === 'arrowdown' || k === 'arrowright'){ ev.preventDefault(); step(1); return; }
    if (k === 'arrowup' || k === 'arrowleft'){ ev.preventDefault(); step(-1); return; }
    var keyMap = {};
    allWords().forEach(function(f){ if (f.key) keyMap[f.key] = f.id; });
    if (keyMap[k]){ ev.preventDefault(); bump(state.active, keyMap[k], +1); }
  });

  window.addEventListener('beforeunload', function(ev){
    if (grand() > 0 && !storeOK){ ev.preventDefault(); ev.returnValue = ''; }
  });

  /* ---------------- boot ---------------- */
  function adopt(d){
    uid = d.uid || 0; cid = d.cid || 0;
    custom = Array.isArray(d.custom) ? d.custom.filter(function(f){ return f && f.id && f.label; }) : [];
    var keys = allWords().map(function(f){ return f.id; });
    state.speakers = d.speakers.map(function(sp){
      var c = {};
      keys.forEach(function(k){ c[k] = (sp.counts && sp.counts[k]) || 0; });
      /* V6 merged the old standalone 'mm / hmm' row into 'um / mm / hmm' —
         carry any counts saved under the retired id across instead of dropping them. */
      if (sp.counts && sp.counts.mm) c.um = (c.um||0) + sp.counts.mm;
      return {
        id:sp.id, role:sp.role||'', name:(sp.name!=null ? sp.name : PLACEHOLDER),
        segment: SEGMENTS.indexOf(sp.segment)>=0 ? sp.segment : 'Other',
        note:sp.note||'', otherText:sp.otherText||'', counts:c
      };
    });
    state.active = find(d.active) ? d.active : state.speakers[0].id;
    state.history = [];
  }

  $('kdate').textContent = 'V7  ·  ' + new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  loadClub();
  $('clubField').addEventListener('input', saveClub);


  var saved = load();
  if (saved){
    var savedTotal = 0;
    saved.speakers.forEach(function(sp){ for (var k in (sp.counts||{})) savedTotal += sp.counts[k]||0; });
    if (savedTotal > 0){
      adopt(saved);
      var when = '';
      try{ when = new Date(saved.at).toLocaleString(undefined,{hour:'numeric',minute:'2-digit',day:'numeric',month:'short'}); }catch(e){}
      $('bannerTxt').textContent = 'Restored an unfinished log — ' + savedTotal + ' crutches across ' +
        saved.speakers.length + ' speakers' + (when ? ', last saved ' + when : '') + '.';
      $('banner').classList.add('on');
    }
  }

  $('keepBtn').addEventListener('click', function(){ $('banner').classList.remove('on'); });
  $('freshBtn').addEventListener('click', function(){
    state = fresh(); wipe();
    $('undoBtn').disabled = true;
    renderLedger(); renderRoster(); paintDesk();
    $('grandNum').textContent = 0;
    $('banner').classList.remove('on');
    toast('Fresh log');
  });

  renderLedger();
  renderRoster();
  paintDesk();
  $('grandNum').textContent = grand();
  markSaveState();
  save();
})();
</script>
</body>
</html>
